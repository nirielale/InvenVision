<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvenVision</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="auth-view" class="auth-wrap d-none"></div>

  <div id="app-view" class="d-none">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><i class="bi bi-box-seam-fill"></i><span>InvenVision</span></div>
      <nav id="nav" class="nav flex-column"></nav>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <div class="content-wrap">
      <header class="topbar">
        <button id="menu-btn" class="btn btn-light d-lg-none" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
        <h1 id="page-title" class="h5 mb-0">InvenVision</h1>
        <div class="ms-auto dropdown">
          <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="avatar" id="user-avatar">?</span>
            <span class="d-none d-sm-inline" id="user-name"></span>
            <i class="bi bi-chevron-down small"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#/perfil"><i class="bi bi-person me-2"></i>Perfil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button></li>
          </ul>
        </div>
      </header>
      <main id="main" class="main"></main>
    </div>
  </div>

  <div id="toasts" class="toast-container position-fixed top-0 end-0 p-3"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
